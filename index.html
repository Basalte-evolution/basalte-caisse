<script>
/* ============================================================
   CONFIGURATION
   Colle ici la config Firebase (Realtime Database) pour partager
   les données entre les 3 salles. Si null : mode local (test),
   les données restent dans ce navigateur uniquement.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCMkDFABqgPIJVrkTxLpcbnxSuz2gezPK8",
  authDomain: "caisse-basalte.firebaseapp.com",
  databaseURL: "https://caisse-basalte-default-rtdb.europe-west1.firebasedatabase.app",

  messagingSenderId: "706195912858",
  appId: "1:706195912858:web:4b0de5f905004bf32e8723"
};
/* Exemple :
const FIREBASE_CONFIG = {
  apiKey: "...",
  authDomain: "....firebaseapp.com",
  databaseURL: "https://....firebasedatabase.app",
  projectId: "...",
  appId: "..."
};
*/
const ROOT = "caisse_coffre";
const SITES = ["BE1", "BE2", "BE3"];
const SITE_NOMS = { BE1: "Saint-Pierre", BE2: "Sainte-Clotilde", BE3: "Cambaie" };
const BILLETS = [50000, 20000, 10000, 5000, 2000, 1000, 500];
const PIECES = [200, 100, 50, 20, 10, 5, 2, 1];
const DENOMS = BILLETS.concat(PIECES);
const TYPES = { depot: "Clôture / dépôt", sortie: "Sortie facture", levee: "Levée", ajustement: "Ajustement" };

/* ---------------- Utilitaires ---------------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
const eur = (c) => ((c || 0) / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const dLabel = (c) => c >= 500 ? (c / 100) + " €" : (c >= 100 ? (c / 100) + " €" : (c / 100).toFixed(2).replace(".", ",") + " €");
const parseEur = (s) => { const n = parseFloat(String(s || "").replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? 0 : Math.round(n * 100); };
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const frDate = (s) => s ? s.split("-").reverse().join("/") : "";
const frTs = (t) => new Date(t).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sumCompo = (c) => DENOMS.reduce((a, d) => a + d * (parseInt((c || {})[d]) || 0), 0);
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ---------------- Données ---------------- */
/* Fond de caisse actuel (250 €) : 5×20 € · 8×10 € · 5×5 € · 10×2 € · 15×1 € · 12×0,50 € · 15×0,20 € · 10×0,10 € */
const FOND_DEFAUT = { 2000: 5, 1000: 8, 500: 5, 200: 10, 100: 15, 50: 12, 20: 15, 10: 10 };
/* Démarche pour lire le résultat de la journée dans DECIPLUS (modifiable dans Réglages) */
const DECIPLUS_GUIDE_DEFAUT = "Sur l'ordinateur, ouvre DECIPLUS\nClique sur « MANAGER »\nPointe la souris sur « Historique » et clique sur « Encaissement »\nVérifie que la date affichée est bien celle d'aujourd'hui\nRelève les totaux Espèces, Carte bancaire et Chèque et recopie-les ci-dessous";
/* Démarche pour relever le montant CB, par modèle de TPE (modifiable dans Réglages) */
const TPE_MODELES_DEFAUT = {
  sunmi: { nom: "Sunmi P2 SE (Nepting)", etapes: "Ouvre le menu (icône ≡)\nClique sur « Tickets »\nDans la section « Récapitulatifs », clique sur « Commerçant »\nGlisse vers le bas et relève le montant en €" },
  ingenico: { nom: "Ingenico", etapes: "Clique sur le bouton menu (point noir dans un cercle noir)\nClique sur « Mes totaux »\nRelève le montant du jour en €" }
};
function defaults() {
  return {
    config: {
      tolerance: 200,
      poles: ["Bar", "Restaurant", "Escalade", "Ouverture", "Bricolage"],
      fonds: {
        BE1: { f0: { debut: "2026-01-01", compo: FOND_DEFAUT } },
        BE2: { f0: { debut: "2026-01-01", compo: FOND_DEFAUT } },
        BE3: { f0: { debut: "2026-01-01", compo: FOND_DEFAUT } }
      },
      tpe: { BE1: { t0: { nom: "TPE Sunmi", modele: "sunmi" }, t1: { nom: "TPE Ingenico", modele: "ingenico" } }, BE2: { t0: { nom: "TPE Sunmi", modele: "sunmi" }, t1: { nom: "TPE Ingenico", modele: "ingenico" } }, BE3: { t0: { nom: "TPE Sunmi", modele: "sunmi" }, t1: { nom: "TPE Ingenico", modele: "ingenico" } } },
      codesSalle: { BE1: "0971", BE2: "0972", BE3: "0973" },
      tpeModeles: TPE_MODELES_DEFAUT,
      deciplusGuide: DECIPLUS_GUIDE_DEFAUT,
      users: { admin: { prenom: "Admin", nom: "", pin: "0000", role: "admin" } }
    },
    mouvements: {}
  };
}
function normalize(raw) {
  const d = defaults();
  if (!raw) return d;
  const c = raw.config || {};
  return {
    config: {
      tolerance: c.tolerance == null ? d.config.tolerance : c.tolerance,
      poles: Array.isArray(c.poles) ? c.poles.filter(Boolean) : (c.poles ? Object.values(c.poles) : []),
      fonds: c.fonds || d.config.fonds,
      tpe: c.tpe || {},
      codesSalle: c.codesSalle || d.config.codesSalle,
      tpeModeles: Object.assign({}, d.config.tpeModeles, c.tpeModeles || {}),
      deciplusGuide: c.deciplusGuide || d.config.deciplusGuide,
      users: c.users || d.config.users
    },
    mouvements: raw.mouvements || {}
  };
}
let RAW = null, S = defaults();
const Store = {
  mode: "local",
  init(cb) {
    if (FIREBASE_CONFIG && window.firebase) {
      firebase.initializeApp(FIREBASE_CONFIG);
      this.db = firebase.database();
      this.mode = "firebase";
      let first = true;
      $("app").innerHTML = `<main style="padding-top:80px"><p class="mute" style="text-align:center">Connexion…</p></main>`;
      /* Connexion anonyme : permet des règles Firebase « auth != null » */
      firebase.auth().signInAnonymously().catch((e) => { $("app").innerHTML = `<main style="padding-top:80px"><div class="alert bad">Connexion Firebase impossible : ${esc(e.message)}<small>Vérifie que la connexion « Anonyme » est activée dans Firebase → Authentication.</small></div></main>`; });
      firebase.auth().onAuthStateChanged((user) => { if (!user || this.listening) return; this.listening = true;
      this.db.ref(ROOT).on("value", (snap) => {
        const val = snap.val();
        /* Première mise en service : on écrit la configuration par défaut complète */
        if (!val || !val.config) { this.db.ref(ROOT + "/config").set(defaults().config); return; }
        S = normalize(val);
        /* ne pas effacer un formulaire en cours de saisie quand une autre salle enregistre */
        const enSaisie = session.site && (["sortie", "levee", "reglages"].includes(view) || (view === "cloture" && wiz));
        if (first || !enSaisie) cb();
        first = false;
      }, (err) => { $("app").innerHTML = `<main style="padding-top:80px"><div class="alert bad">Accès à la base refusé : ${esc(err.message)}<small>Vérifie les règles de sécurité Firebase.</small></div></main>`; });
      });
    } else {
      try { RAW = JSON.parse(localStorage.getItem(ROOT) || "null"); } catch (e) { RAW = null; }
      if (!RAW) RAW = defaults();
      S = normalize(RAW); cb();
    }
  },
  set(path, val) {
    if (this.mode === "firebase") return this.db.ref(ROOT + "/" + path).set(val).then(() => render()).catch((e) => { toast("Erreur d'enregistrement : " + e.message); throw e; });
    const parts = path.split("/"); let o = RAW;
    for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]] || typeof o[parts[i]] !== "object") o[parts[i]] = {}; o = o[parts[i]]; }
    if (val === null) delete o[parts[parts.length - 1]]; else o[parts[parts.length - 1]] = JSON.parse(JSON.stringify(val));
    try { localStorage.setItem(ROOT, JSON.stringify(RAW)); } catch (e) { toast("Stockage local plein"); }
    S = normalize(RAW); render();
    return Promise.resolve();
  }
};

/* ---------------- Logique métier ---------------- */
function getFond(site, date) {
  const list = Object.values(S.config.fonds[site] || {}).filter((f) => f.debut <= date).sort((a, b) => a.debut < b.debut ? 1 : -1);
  const f = list[0] || { debut: "", compo: {} };
  return { debut: f.debut, compo: f.compo || {}, montant: sumCompo(f.compo) };
}
function mvts(filter) {
  return Object.entries(S.mouvements).map(([id, m]) => Object.assign({ id }, m)).filter(filter || (() => true)).sort((a, b) => b.ts - a.ts);
}
function solde(site) {
  let esp = 0, chq = 0;
  mvts((m) => m.site === site && !m.annule).forEach((m) => {
    if (m.type === "depot") { esp += (m.depotEsp || 0) - (m.complementEsp || 0); chq += m.totalChq || 0; }
    if (m.type === "sortie") esp -= m.montant || 0;
    if (m.type === "levee") { esp += (m.ecartEsp || 0) - (m.leveEsp || 0); chq += (m.ecartChq || 0) - (m.leveChq || 0); }
    if (m.type === "ajustement") { esp += m.deltaEsp || 0; chq += m.deltaChq || 0; }
  });
  return { esp, chq };
}
/* Propose ce qu'on laisse en caisse pour reconstituer le fond */
function proposeLaisse(compte, fond) {
  const laisse = {};
  let total = 0;
  DENOMS.forEach((d) => { const k = Math.min(compte[d] || 0, parseInt(fond.compo[d]) || 0); laisse[d] = k; total += k * d; });
  let manque = fond.montant - total;
  if (manque > 0) {
    DENOMS.forEach((d) => { if (manque <= 0) return; const dispo = (compte[d] || 0) - laisse[d]; const n = Math.min(dispo, Math.floor(manque / d)); if (n > 0) { laisse[d] += n; manque -= n * d; } });
  }
  return laisse;
}

function depotGrid() {

/* Compare ce qui reste dans le tiroir à la composition prévue du fond */
function analyseFond(compte, depot, fond, compl) {
  compl = compl || {};
  const lignes = [], manque = {}, trop = {};
  DENOMS.forEach((d) => {
    const prevu = parseInt(fond.compo[d]) || 0, laisse = Math.max((compte[d] || 0) - (depot[d] || 0), 0) + (compl[d] || 0);
    if (!prevu && !laisse) return;
    lignes.push({ d, prevu, laisse });
    if (laisse < prevu) manque[d] = prevu - laisse;
    if (laisse > prevu) trop[d] = laisse - prevu;
  });
  return { lignes, manque, trop, totalLaisse: lignes.reduce((a, l) => a + l.laisse * l.d, 0) };
}
function fondCard() {

    if (!m.ecartEsp && !m.ecartChq && !m.ecartCb) pills += `<span class="pill ok">Juste</span>`;

      (m.tpe ? `<br>TPE : ${m.tpe.map((t) => esc(t.nom) + " " + eur(t.montant)).join(" · ")} · DECIPLUS CB : ${eur(m.decCb)}` : "") +
      ((m.cheques || []).length ? `<br>Chèques : ${m.cheques.map((c) => esc(c.emetteur || "?") + " n°" + esc(c.numero || "?") + " " + eur(c.montant)).join(" ; ")}` : "");
  }
  if (m.type === "sortie") {
    titre = (m.nature === "remboursement" ? "Remboursement · " + esc(m.beneficiaire) : esc(m.fournisseur)); mt = "−" + eur(m.montant);
    pills = `<span class="pill">${esc(m.pole)}</span><span class="pill">${esc(m.siteConcerne)}</span>`;
    det = `Objet : ${esc(m.fournisseur)}<br>Facture n° ${esc(m.numFacture)} du ${frDate(m.dateFacture)}<br>Sortie le ${frDate(m.date)}` + (m.photo ? `<img class="photo" src="${m.photo}">` : "");
  }
  if (m.type === "levee") {
    titre = "Levée " + frDate(m.date); mt = "−" + eur(m.leveEsp) + (m.leveChq ? " · chq " + eur(m.leveChq) : "");
    if (m.ecartEsp || m.ecartChq) pills = `<span class="pill bad">Écart coffre ${eur(m.ecartEsp)}${m.ecartChq ? " / chq " + eur(m.ecartChq) : ""}</span>`; else pills = `<span class="pill ok">Coffre juste</span>`;
    det = `Théorique : ${eur(m.theoEsp)} / chq ${eur(m.theoChq)}<br>Constaté : ${eur(m.constateEsp)} / chq ${eur(m.constateChq)}`;
  }
  if (m.type === "ajustement") { titre = "Ajustement"; mt = (m.deltaEsp >= 0 ? "+" : "") + eur(m.deltaEsp) + (m.deltaChq ? " · chq " + eur(m.deltaChq) : ""); }
  if (m.commentaire) det += `<br><i>« ${esc(m.commentaire)} »</i>`;
  const mods = Object.values(m.modifs || {}).sort((a, b) => a.ts - b.ts);
  if (mods.length) { pills += `<span class="pill warn">Modifié</span>`; det += mods.map((x) => `<br><span style="color:var(--warn)">Modifié par ${esc(x.par)} le ${frTs(x.ts)} : ${esc(x.motif)}<br>${Object.entries(x.avant).map(([k, v]) => `${esc(fieldLabel(m.type, k))} : ${fmtField(m.type, k, v)} → ${fmtField(m.type, k, x.apres[k])}`).join(" · ")}</span>`).join(""); }
  if (m.annule) det += `<br><b>Annulé par ${esc(m.annule.par)} le ${frTs(m.annule.ts)} : ${esc(m.annule.motif)}</b>`;
  else if (isResp()) det += `<div class="row" style="margin-top:10px;justify-content:flex-start;gap:8px"><button class="btn sm" style="flex:0 0 auto" onclick="event.stopPropagation();editMvtId='${m.id}';render()">Modifier les chiffres</button><button class="btn sm red" style="flex:0 0 auto" onclick="event.stopPropagation();annuler('${m.id}')">Annuler</button></div>`;
  return `<div class="item ${m.annule ? "annule" : ""}" onclick="this.classList.toggle('open')"><div class="h"><span>${titre}</span><span>${mt}</span></div>
  <div class="mute">${esc(m.site)} · ${TYPES[m.type]} · ${esc(m.userNom)} · ${frTs(m.ts)}</div><div>${pills}</div><div class="d">${det}</div></div>`;
}
function histFiltered() {
  if (!isResp()) { const lim = Date.now() - 7 * 864e5; return mvts((m) => m.site === session.site && m.ts > lim && (m.type === "depot" || m.type === "sortie")); }
  return mvts((m) => (!histF.site || m.site === histF.site) && (!histF.type || m.type === histF.type) && (!histF.mois || (m.date || "").slice(0, 7) === histF.mois));
}
function histoView() {
  const list = histFiltered();
  if (!isResp()) return `<div class="card"><h2>Saisies de la salle</h2><p class="mute">Clôtures et sorties de ${esc(session.site)} des 7 derniers jours.</p>${list.length ? list.map(mvtLine).join("") : `<p class="mute">Aucune saisie.</p>`}</div>`;
  return `<div class="card"><h2>Historique</h2>
  <div class="row"><select onchange="histF.site=this.value;render()"><option value="">Toutes salles</option>${SITES.map((s) => `<option ${histF.site === s ? "selected" : ""}>${s}</option>`).join("")}</select>
  <select onchange="histF.type=this.value;render()"><option value="">Tous types</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${histF.type === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
  <label>Mois</label><input type="month" value="${histF.mois}" onchange="histF.mois=this.value;render()">
  ${isResp() ? `<button class="btn sm sec" style="margin-top:10px" onclick="exportCSV()">Exporter en CSV</button>` : ""}
  <div style="margin-top:10px">${list.length ? list.map(mvtLine).join("") : `<p class="mute">Aucun mouvement.</p>`}</div></div>`;
}
function annuler(id) {
  const motif = window.prompt("Motif de l'annulation :");
  if (!motif) return;
  Store.set("mouvements/" + id + "/annule", { par: meNom(), ts: Date.now(), motif });
}
function exportCSV() {
  const rows = [["Date", "Salle", "Type", "Saisi par", "Espèces", "Chèques", "Écart espèces", "Écart chèques", "TPE", "DECIPLUS CB", "Écart CB", "Fournisseur/objet", "Bénéficiaire", "N° facture", "Date facture", "Site concerné", "Pôle", "Commentaire", "Annulé"]];
  histFiltered().forEach((m) => {
    let e = 0, c = 0;
    if (m.type === "depot") { e = m.depotEsp; c = m.totalChq; }
    if (m.type === "sortie") e = -m.montant;
    if (m.type === "levee") { e = -m.leveEsp; c = -m.leveChq; }
    if (m.type === "ajustement") { e = m.deltaEsp; c = m.deltaChq; }
    rows.push([m.date, m.site, TYPES[m.type], m.userNom, (e || 0) / 100, (c || 0) / 100, (m.ecartEsp || 0) / 100, (m.ecartChq || 0) / 100, (m.totalTpe || 0) / 100, (m.decCb || 0) / 100, (m.ecartCb || 0) / 100, m.fournisseur || "", m.beneficiaire || "", m.numFacture || "", m.dateFacture || "", m.siteConcerne || "", m.pole || "", m.commentaire || "", m.annule ? "oui" : ""]);
  });
  const csv = rows.map((r) => r.map((v) => "\"" + String(v).replace(/"/g, "\"\"").replace(/\./g, typeof v === "number" ? "," : ".") + "\"").join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = "caisse_" + (histF.mois || "tout") + ".csv"; a.click();
}

function tableauView() {
  const seg = `<div class="seg"><button class="${suiviTab === "coffres" ? "on" : ""}" onclick="suiviTab='coffres';render()">Coffres</button><button class="${suiviTab === "tpe" ? "on" : ""}" onclick="suiviTab='tpe';render()">TPE / DECIPLUS</button></div>`;
  return seg + (suiviTab === "tpe" ? tpeView() : coffresView());
}
function tpeView() {
  const list = mvts((m) => m.type === "depot" && !m.annule && (m.date || "").slice(0, 7) === tpeF.mois && (!tpeF.site || m.site === tpeF.site)).sort((a, b) => a.date < b.date ? 1 : -1);
  const tol = S.config.tolerance || 0;
  let tTpe = 0, tDec = 0, nE = 0;
  list.forEach((m) => { tTpe += m.totalTpe || 0; tDec += m.decCb || 0; if (m.ecartCb) nE++; });
  const parSite = SITES.map((s) => { const l = list.filter((m) => m.site === s); return [s, l.reduce((a, m) => a + (m.totalTpe || 0), 0), l.reduce((a, m) => a + (m.decCb || 0), 0)]; });
  return `<div class="card"><h2>Rapprochement TPE ↔ DECIPLUS</h2>
  <div class="row"><select onchange="tpeF.site=this.value;render()"><option value="">Toutes salles</option>${SITES.map((s) => `<option ${tpeF.site === s ? "selected" : ""}>${s}</option>`).join("")}</select><input type="month" value="${tpeF.mois}" onchange="tpeF.mois=this.value;render()"></div>
  <div class="kpi" style="margin-top:12px"><div><div class="mute">Total TPE</div><div class="big">${eur(tTpe)}</div></div><div><div class="mute">Total DECIPLUS CB</div><div class="big">${eur(tDec)}</div></div></div>
  ${ecartBloc("Écart du mois", tTpe - tDec, tol)}
  <p class="mute">${list.length} clôture(s) · ${nE} jour(s) avec écart</p>
  ${!tpeF.site ? `<table class="grid"><tr><th>Salle</th><th>TPE</th><th>DECIPLUS</th><th>Écart</th></tr>${parSite.map(([s, a, b]) => `<tr><td>${s}</td><td>${eur(a)}</td><td>${eur(b)}</td><td style="color:${a - b ? "var(--bad)" : "var(--ok)"}">${eur(a - b)}</td></tr>`).join("")}</table>` : ""}</div>
  <div class="card"><h2>Détail par jour</h2>${list.length ? `<table class="grid"><tr><th>Jour</th><th>TPE</th><th>DECIPLUS</th><th>Écart</th></tr>${list.map((m) => `<tr><td>${frDate(m.date).slice(0, 5)} <span class="mute">${m.site}</span></td><td>${eur(m.totalTpe)}</td><td>${eur(m.decCb)}</td><td style="color:${!m.ecartCb ? "var(--ok)" : Math.abs(m.ecartCb) > tol ? "var(--bad)" : "var(--warn)"}">${m.ecartCb ? eur(m.ecartCb) : "✓"}</td></tr>`).join("")}</table>` : `<p class="mute">Aucune clôture ce mois-ci.</p>`}
  <p class="mute" style="margin-top:10px">Astuce : le total TPE du mois doit aussi se retrouver sur le relevé bancaire (moins les commissions).</p></div>`;
}
function coffresView() {
  const mois = today().slice(0, 7);
  const cards = SITES.map((s) => {
    const so = solde(s);
    const lastDep = mvts((m) => m.site === s && m.type === "depot" && !m.annule)[0];
    const lastLev = mvts((m) => m.site === s && m.type === "levee" && !m.annule)[0];
    return `<div class="card"><h2>${s} · ${SITE_NOMS[s]}</h2><div class="kpi"><div><div class="mute">Espèces au coffre</div><div class="big">${eur(so.esp)}</div></div><div><div class="mute">Chèques au coffre</div><div class="big">${eur(so.chq)}</div></div></div>
    <p class="mute">Dernière clôture : ${lastDep ? frDate(lastDep.date) + " (" + esc(lastDep.userNom) + ")" + (lastDep.ecartEsp ? " · écart " + eur(lastDep.ecartEsp) : " · juste") : "aucune"}<br>Dernière levée : ${lastLev ? frDate(lastLev.date) + " (" + esc(lastLev.userNom) + ")" : "aucune"}</p>
    ${lastDep && lastDep.fondManque && Object.keys(lastDep.fondManque).length ? `<div class="alert warn">Monnaie à prévoir pour le fond<small>${DENOMS.filter((d) => lastDep.fondManque[d]).map((d) => lastDep.fondManque[d] + " × " + dLabel(d)).join(" · ")}</small></div>` : (lastDep && lastDep.resteCaisse != null && lastDep.resteCaisse !== lastDep.fond ? `<div class="alert warn">Fond laissé : ${eur(lastDep.resteCaisse)} au lieu de ${eur(lastDep.fond)}</div>` : "")}</div>`;
  }).join("");
  const ecarts = mvts((m) => !m.annule && (m.ecartEsp || m.ecartChq || m.ecartCb)).slice(0, 15);
  const sorties = mvts((m) => m.type === "sortie" && !m.annule && (m.date || "").slice(0, 7) === mois);
  const parPole = {}; sorties.forEach((m) => { const k = (m.pole || "?") + " · " + m.siteConcerne; parPole[k] = (parPole[k] || 0) + m.montant; });

}

  <div class="row"><div><label>Espèces (+/−)</label><input id="aj_esp" inputmode="decimal" placeholder="ex. 50 ou -20"></div><div><label>Chèques (+/−)</label><input id="aj_chq" inputmode="decimal" placeholder="0"></div></div>
  <label>Motif</label><input id="aj_mot">
  <button class="btn" onclick="saveAjust()">Enregistrer l'ajustement</button></div>

  <div class="card"><h2>Données</h2><p class="mute">Stockage : ${Store.mode === "firebase" ? "Firebase (partagé)" : "local (cet appareil)"}</p>
  <button class="btn sec" onclick="backup()">Télécharger une sauvegarde (JSON)</button></div>` : ""}`;
}
function saveFond() {
  const compo = readGrid("fnd"), debut = $("fnd_debut").value;
  if (!debut || sumCompo(compo) === 0) { toast("Date et composition obligatoires"); return; }
  const sites = $("fnd_all").checked ? SITES : [fondSite];
  Promise.all(sites.map((x) => Store.set("config/fonds/" + x + "/" + newId(), { debut, compo }))).then(() => toast("Fond enregistré pour " + sites.join(", ")));
}
function printFond(site) {
  const f = getFond(site, today());
  const rows = DENOMS.filter((d) => f.compo[d]).sort((a, b) => a - b).map((d) => `<tr><td>${f.compo[d]} × ${dLabel(d)}</td><td>${eur(f.compo[d] * d)}</td><td class="c"></td></tr>`).join("");
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Fond de caisse ${site}</title><style>body{font-family:-apple-system,Segoe UI,sans-serif;padding:30px;color:#111}h1{font-size:22px;margin:0}p{color:#555;margin:4px 0 18px}table{border-collapse:collapse;width:100%;font-size:22px}td{border-bottom:1px solid #ccc;padding:12px 6px}td:nth-child(2){text-align:right}td.c{width:60px;border:2px solid #111;border-width:0 0 1px 0}.tot td{font-weight:700;border-top:2px solid #111;border-bottom:0}small{color:#777}</style></head><body>
  <h1>Basalte Évolution · Fond de caisse ${site} ${SITE_NOMS[site]}</h1><p>En vigueur depuis le ${frDate(f.debut)} · à laisser dans le tiroir chaque soir</p>
  <table>${rows}<tr class="tot"><td>Total</td><td>${eur(f.montant)}</td><td></td></tr></table><p><small>Colonne de droite : cocher en vérifiant.</small></p></body></html>`;
  const w = window.open("", "_blank"); if (!w) { toast("Autorise les fenêtres pour imprimer"); return; }
  w.document.write(html); w.document.close(); setTimeout(() => w.print(), 300);
}
function delFond(id) { if (window.confirm("Supprimer cette période de fond ?")) Store.set("config/fonds/" + fondSite + "/" + id, null); }
function addTpe() { const v = $("newTpe").value.trim(); if (!v) { toast("Donne un nom au TPE"); return; } Store.set("config/tpe/" + fondSite + "/" + newId(), { nom: v, modele: $("newTpeMod").value }); }
function setTpe(id, k, v) {
  const cur = S.config.tpe[fondSite][id]; const o = typeof cur === "string" ? { nom: cur, modele: "" } : Object.assign({}, cur);
  o[k] = String(v).trim(); if (k === "nom" && !o.nom) { toast("Nom obligatoire"); render(); return; }
  Store.set("config/tpe/" + fondSite + "/" + id, o).then(() => toast("TPE mis à jour"));
}
function saveModele(k) { Store.set("config/tpeModeles/" + k, { nom: $("tm_nom_" + k).value.trim() || k, etapes: $("tm_et_" + k).value.trim() }).then(() => toast("Démarche enregistrée")); }
function delTpe(id) { if (window.confirm("Retirer ce TPE ?")) Store.set("config/tpe/" + fondSite + "/" + id, null); }
function addPole() { const v = $("newPole").value.trim(); if (!v) return; Store.set("config/poles", S.config.poles.concat([v])); }
function delPole(i) { const p = S.config.poles.slice(); p.splice(i, 1); Store.set("config/poles", p); }
function codeLibre(code, saufUser) {
  if (SITES.some((x) => S.config.codesSalle[x] === code)) return false;
  return !Object.entries(S.config.users).some(([id, u]) => u.pin === code && id !== saufUser);
}
function saveCodesSalle() {
  if (!isAdmin()) return;
  const c = {}; for (const x of SITES) { c[x] = $("cs_" + x).value.trim(); if (!/^\d{4}$/.test(c[x])) { toast("Code " + x + " : 4 chiffres"); return; } }
  if (new Set(Object.values(c)).size !== 3) { toast("Les 3 codes doivent être différents"); return; }
  if (Object.values(S.config.users).some((u) => Object.values(c).includes(u.pin))) { toast("Un code de salle est identique au code d'un responsable"); return; }
  Store.set("config/codesSalle", c).then(() => toast("Codes enregistrés"));
}
function saveUser() {
  if (!isAdmin()) return;
  const pin = $("u_pin").value.trim(), pre = $("u_pre").value.trim(), role = $("u_role").value;
  if (!/^\d{4}$/.test(pin)) { toast("Le code doit faire 4 chiffres"); return; }
  if (!pre) { toast("Prénom obligatoire"); return; }
  if (!codeLibre(pin, editUser)) { toast("Ce code est déjà utilisé (responsable ou salle)"); return; }
  if (editUser === session.uid && role !== roleOf(me())) { toast("Tu ne peux pas changer ton propre rôle"); return; }
  const id = editUser === "new" ? newId() : editUser;
  Store.set("config/users/" + id, { prenom: pre, nom: $("u_nom").value.trim(), pin, role }).then(() => { editUser = null; toast("Responsable enregistré"); render(); });
}
function delUser() { if (window.confirm("Supprimer cet utilisateur ?")) { const id = editUser; editUser = null; Store.set("config/users/" + id, null); } }
function saveAjust() {
  if (!isAdmin()) return;
  const de = parseEur($("aj_esp").value), dc = parseEur($("aj_chq").value), mot = $("aj_mot").value.trim();
  if (!de && !dc) { toast("Montant vide"); return; }
  if (!mot) { toast("Motif obligatoire"); return; }
  Store.set("mouvements/" + newId(), { type: "ajustement", site: $("aj_site").value, date: today(), ts: Date.now(), uid: session.uid, userNom: meNom(), deltaEsp: de, deltaChq: dc, commentaire: mot }).then(() => toast("Ajustement enregistré"));
}
function backup() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ config: S.config, mouvements: S.mouvements }, null, 1)], { type: "application/json" }));
  a.download = "sauvegarde_caisse_" + today() + ".json"; a.click();
}

/* Appareil partagé : le mode responsable se ferme après 5 min sans activité ; la salle reste ouverte */
const INACTIVITE_MIN = 5;
let lastAct = Date.now();
["pointerdown", "keydown", "input", "scroll"].forEach((ev) => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
setInterval(() => { if (session.uid && Date.now() - lastAct > INACTIVITE_MIN * 60000) { finResp(); toast("Mode responsable fermé après " + INACTIVITE_MIN + " min d'inactivité"); } }, 15000);

Store.init(render);
</script>
</body>
</html>
